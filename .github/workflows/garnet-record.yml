name: Dependency install and test (recorded)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rb/**'

concurrency:
  group: record-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  install-test:
    name: Install and test (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: corepack enable

      # OIDC exchange; no token to configure.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Install dependencies (lifecycle scripts execute here)
        run: pnpm install --no-frozen-lockfile

      - name: Test
        continue-on-error: true
        run: pnpm --dir packages/js-sdk build && timeout 600 pnpm --dir packages/js-sdk exec vitest run --project unit

      - name: Let sensor settle
        if: always()
        run: sleep 30
