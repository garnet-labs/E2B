# Records the dependency install under the Garnet sensor on every pull request,
# Dependabot's included, and on every push to the default branch. Pull request
# runs get one Runtime Review comment per head commit. Default-branch pushes
# post no comment; they leave the base record a pull request's first recorded
# commit is compared with. Later commits compare with the previous recorded
# commit on the pull request.
name: Garnet Runtime Visibility

on:
  push:
    branches: ['main', 'rb/**', 'shadow/base/**']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: garnet-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  install-test:
    name: Dependency install (recorded)
    if: &oidc_recording >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/shadow/base/')) ||
       (github.event_name == 'pull_request' &&
        !startsWith(github.head_ref, 'shadow/pr/') && !startsWith(github.base_ref, 'shadow/base/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps: &dependency_steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '${{ env.TOOL_VERSION_NODEJS }}'

      - run: corepack enable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'


      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Install dependencies (lifecycle scripts execute here)
        run: |
          pnpm install --frozen-lockfile
          for d in packages/python-sdk packages/code-interpreter-python packages/desktop-python; do
            (cd "$d" && uv sync --frozen)
          done

      - name: Let sensor settle
        if: always()
        run: sleep 30

  docker-build:
    name: Codegen image build (recorded)
    if: *oidc_recording
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps: &codegen_steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Build codegen image
        run: docker build -f codegen.Dockerfile .
      - name: Let sensor settle
        if: always()
        run: sleep 30

  # PR runs can relay profiles as artifacts. Push and dispatch baselines
  # still need the OIDC path because the App only collects PR artifacts.
  shadow-install-test:
    name: Dependency install (recorded)
    if: &shadow_recording >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'shadow/pr/') || startsWith(github.base_ref, 'shadow/base/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GARNET_PROFILE_JOB: install-test
    steps: *dependency_steps

  shadow-docker-build:
    name: Codegen image build (recorded)
    if: *shadow_recording
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GARNET_PROFILE_JOB: docker-build
    steps: *codegen_steps
