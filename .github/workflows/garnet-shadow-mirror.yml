name: Shadow dependency mirror
on:
    pull_request:
        paths:
            - .github/scripts/shadow_mirror/**
            - .github/workflows/garnet-shadow-mirror.yml
            - .github/workflows/garnet-record.yml
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:
        inputs:
            prs:
                description: Optional space-separated change numbers
                required: false
                type: string
            verdict_prs:
                description: Refresh only existing verdict comments for these mirror PR numbers
                required: false
                type: string
permissions: {}
concurrency:
    group: shadow-dependency-mirror
    cancel-in-progress: false
jobs:
    test:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
              with:
                  version: '0.13.4'
            - name: Test shadow mirror
              run: |
                  uv venv --python python3 "$RUNNER_TEMP/shadow-mirror"
                  uv pip install --python "$RUNNER_TEMP/shadow-mirror/bin/python" --only-binary=:all: PyYAML==6.0.3
                  "$RUNNER_TEMP/shadow-mirror/bin/python" -m unittest discover -s .github/scripts/shadow_mirror

    sync:
        if: github.repository == 'garnet-labs/E2B' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            PRS: ${{ inputs.prs }}
            VERDICT_PRS: ${{ inputs.verdict_prs }}
        steps:
            - name: Check authentication
              id: auth
              env:
                  SHADOW_MIRROR_TOKEN: ${{ secrets.SHADOW_MIRROR_TOKEN }}
              run: |
                  if [ -z "$SHADOW_MIRROR_TOKEN" ]; then
                    echo '::error::Set the SHADOW_MIRROR_TOKEN secret to a PAT with write access to Contents, Pull requests, Actions, and Workflows.'
                    exit 1
                  else
                    echo 'enabled=true' >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              if: steps.auth.outputs.enabled == 'true'
              with:
                  sparse-checkout: .github/scripts/shadow_mirror
                  sparse-checkout-cone-mode: false
                  persist-credentials: false
            - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
              if: steps.auth.outputs.enabled == 'true'
              with:
                  version: '0.13.4'
            - name: Install shadow mirror dependencies
              if: steps.auth.outputs.enabled == 'true'
              run: |
                  uv venv --python python3 "$RUNNER_TEMP/shadow-mirror"
                  uv pip install --python "$RUNNER_TEMP/shadow-mirror/bin/python" --only-binary=:all: PyYAML==6.0.3
            - name: Sync dependency changes
              if: steps.auth.outputs.enabled == 'true'
              env:
                  SHADOW_MIRROR_TOKEN: ${{ secrets.SHADOW_MIRROR_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  command=sync
                  if [[ -n "$VERDICT_PRS" ]]; then
                    [[ -z "$PRS" ]] || { echo 'Choose sync or verdict refresh, not both'; exit 1; }
                    command=refresh-verdict
                    PRS="$VERDICT_PRS"
                  fi
                  args=()
                  for pr in $PRS; do
                    [[ "$pr" =~ ^[0-9]+$ ]] || { echo 'Invalid change number'; exit 1; }
                    args+=(--pr "$pr")
                  done
                  "$RUNNER_TEMP/shadow-mirror/bin/python" .github/scripts/shadow_mirror/mirror.py "$command" "${args[@]}"
