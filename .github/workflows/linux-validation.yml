name: Linux validation

on:
  push:
    branches: [ci-linux-validation]

permissions:
  contents: read
  id-token: write

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - uses: "garnet-org/action@v2.6.0"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
      - uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7"
        with:
          enable-cache: false
      - name: "Install dependencies"
        run: |
          uv sync --locked
        working-directory: "packages/python-sdk"
      - name: "Run checks"
        run: |
          uv run pytest --verbose --numprocesses=4 tests/test_api_exception.py tests/test_env_var_parsing.py tests/test_envd_codec.py
        working-directory: "packages/python-sdk"
